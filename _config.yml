# Site settings
lang: zh-CN
timezone: Asia/Shanghai

title: "Chuanqi's Blog"
tagline: "Systems · Performance · JVM · Infra"
description: "技术博客：系统性能、JVM、编译器、GPU、Linux 内核等工程笔记。"

url: "https://zangcq.github.io"

github:
  username: zangcq

social:
  name: Chuanqi Zang
  email: ""
  links:
    - https://github.com/zangcq
    - https://www.linkedin.com/in/chuanqi-zang

# Theme
theme: jekyll-theme-chirpy
theme_mode: dark

avatar: ""

toc: true

paginate: 10

baseurl: ""

# Build settings
markdown: kramdown
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - .DS_Store
  - .bundle/
  - vendor/
  - scripts/